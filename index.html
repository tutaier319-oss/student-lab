<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벽돌깨기 | Student Lab</title><meta name="description" content="웹사이트 제작 실습: 벽돌깨기와 학생상담 자동응답"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312223e'/%3E%3Ctext x='7' y='23' fill='white' font-size='22'%3ES%3C/text%3E%3C/svg%3E"><style>*{box-sizing:border-box}body{margin:0;background:#f1f4fa;color:#14233f;font:16px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif}header{background:#12223e;color:white;padding:22px max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:24px}header b{font-size:21px}nav{display:flex;gap:18px}nav a{color:#cad7f2;text-decoration:none;font-size:14px}nav a[aria-current]{color:white;border-bottom:2px solid #58d7db}main{max-width:1180px;margin:34px auto;padding:0 24px}h1{font-size:32px;line-height:1.3;margin:8px 0 12px}h2{font-size:20px;margin:0 0 16px}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:700;color:#2766aa}.sub{color:#5b6981}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;margin-top:26px}.card{background:white;border:1px solid #dce3ee;border-radius:18px;padding:24px}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:#225cbe;color:white;border-radius:9px;padding:11px 19px;font-weight:600}button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eaf0fa;color:#244578}input,textarea{width:100%;border:1px solid #bfcbdc;border-radius:9px;padding:12px;background:white;color:#14233f}label{display:block;font-size:14px;margin:12px 0 6px}a{color:#245bb0}small,.small{font-size:14px}details{margin-top:22px}summary{cursor:pointer;color:#375b88}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}footer{max-width:1180px;margin:28px auto;padding:0 24px;color:#63718a;font-size:13px}.status{padding:10px 14px;background:#eaf0fa;border-radius:9px;color:#344c70;font-size:14px;margin:16px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}:focus-visible{outline:3px solid #ed9b2d;outline-offset:3px}li{padding:6px 0}canvas{width:100%;display:block;border-radius:12px;background:#101c32;touch-action:none}.stats{display:flex;gap:28px;margin-bottom:14px}.stats strong{font-size:22px}.chat{height:390px;overflow:auto;padding:8px 0;display:flex;flex-direction:column;gap:14px}.bubble{max-width:90%;padding:15px 18px;border-radius:14px;background:#edf2fa;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#245cba;color:white}.bubble.error{background:#fff0ee;color:#982f23}.bubble small{display:block;margin-bottom:5px;opacity:.75}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chips button{font-size:14px;background:#eef3fc;color:#2f568e;padding:9px 12px}.compose{display:flex;gap:10px;align-items:stretch;margin-top:14px}.compose textarea{resize:vertical;min-height:62px}.compose button{flex-shrink:0}.badge{display:inline-block;background:#ddf4f4;color:#12606a;padding:4px 10px;border-radius:6px;font-size:13px}#leaderboard{padding-left:23px}#leaderboard li{border-bottom:1px solid #edf0f5}#leaderboard li span{float:right;font-weight:700}@media(max-width:800px){header{padding:18px 22px;align-items:flex-start;flex-direction:column;gap:10px}.grid{grid-template-columns:1fr}main{margin:25px auto;padding:0 16px}.card{padding:18px}h1{font-size:27px}.chat{height:340px}nav{flex-wrap:wrap}.compose button{padding:10px} }</style></head><body><header><b>STUDENT LAB <span style="color:#5bd7db">/</span></b><nav><a href="index.html" aria-current="page">01 벽돌깨기</a><a href="counseling.html" >02 학생상담</a></nav></header><main><div class="eyebrow">01 / PLAY & CONNECT</div><h1>잠깐의 도전, 벽돌깨기</h1><p class="sub">이름을 입력하고 도전하세요. 모든 벽돌을 깨면 승리합니다.</p><div class="grid"><section class="card"><div class="stats"><div>점수 <strong id="score">0</strong></div><div>남은 기회 <strong id="lives">3</strong></div><div>목표 <strong>280</strong></div></div><canvas id="game" width="720" height="440" tabindex="0" aria-label="벽돌깨기 게임. 좌우 방향키 또는 터치로 패들을 움직이세요."></canvas><p id="gameState" role="status">이름을 입력한 뒤 시작 버튼을 눌러주세요.</p><div class="row"><button id="start" disabled>게임 시작</button><button id="pause" class="secondary" disabled>일시정지</button></div><p class="small sub">← → 이동 · Space 일시정지 · 모바일에서는 게임 화면을 드래그하세요.</p></section><aside><section class="card"><h2>플레이어</h2><form id="login"><label for="name">닉네임 (최대 20자)</label><input id="name" maxlength="20" required placeholder="사용할 이름을 입력하세요"><button style="margin-top:12px" id="loginBtn">이름으로 참가</button></form><p id="player" role="status" class="small"></p></section><section class="card" style="margin-top:20px"><h2>TOP 10 <span class="badge" id="rankMode">이 기기 기록</span></h2><ol id="leaderboard"></ol><p id="saveState" role="status" class="small sub">Firebase 미연결 · 연습 기록은 이 브라우저에만 저장됩니다.</p></section></aside></div></main><footer>웹사이트 제작 실습 · 실제 서비스가 아닌 수업용 프로젝트</footer><script>// Firebase Console의 웹 앱 설정으로 아래 객체를 교체하세요. 서비스 계정 키는 넣지 마세요.
const firebaseConfig = {apiKey:"",authDomain:"",databaseURL:"",projectId:"",appId:""};
const $=id=>document.getElementById(id);let userName='',uid='',db=null,fb=null,run=false,paused=false,score=0,lives=3,px=300,x=360,y=370,vx=230,vy=-230,bricks=[],last=0,keys={};
const cv=$('game'),ctx=cv.getContext('2d');let scores=[];try{scores=JSON.parse(localStorage.getItem('student-lab-scores')||'[]')}catch{}if(!Array.isArray(scores))scores=[];
function ranks(items){$('leaderboard').replaceChildren();items.sort((a,b)=>b.score-a.score).slice(0,10).forEach(r=>{let li=document.createElement('li'),s=document.createElement('span');li.textContent=r.name;s.textContent=r.score;li.append(s);$('leaderboard').append(li)});if(!items.length){let li=document.createElement('li');li.textContent='첫 기록에 도전하세요.';$('leaderboard').append(li)}}ranks(scores);
let cloudPromise=null;
async function cloud(){if(!firebaseConfig.apiKey)return;const base='https://www.gstatic.com/firebasejs/11.10.0/';const [a,b,c]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);let app=a.initializeApp(firebaseConfig);uid=(await b.signInAnonymously(b.getAuth(app))).user.uid;db=c.getDatabase(app);fb=c;c.onValue(c.query(c.ref(db,'scores'),c.orderByChild('score'),c.limitToLast(10)),s=>{ranks(Object.values(s.val()||{}));$('rankMode').textContent='실시간 순위';},()=>{$('saveState').textContent='순위 읽기 실패: Firebase 규칙을 확인하세요.'});$('saveState').textContent='Firebase 연결됨 · 게임 종료 후 기록을 저장합니다.';}
if(firebaseConfig.apiKey)cloudPromise=cloud().catch(()=>{$('saveState').textContent='Firebase 연결 실패 · 설정과 익명 인증을 확인하세요.'});
$('login').onsubmit=e=>{e.preventDefault();userName=$('name').value.trim();if(!userName)return;$('player').textContent=userName+' 님, 준비됐어요.';$('start').disabled=false;};
function resetBall(){px=300;x=360;y=370;vx=230;vy=-230}
function field(){bricks=[];for(let r=0;r<4;r++)for(let c=0;c<7;c++)bricks.push({x:28+c*96,y:40+r*32,on:true,row:r})}field();
function draw(){ctx.clearRect(0,0,720,440);ctx.fillStyle='#172944';for(let i=0;i<15;i++)for(let j=0;j<9;j++)ctx.fillRect(i*50+10,j*50+10,2,2);bricks.forEach(b=>{if(b.on){ctx.fillStyle=['#62d8d0','#5bafe9','#7d8eee','#c6a0ef'][b.row];ctx.fillRect(b.x,b.y,88,22)}});ctx.fillStyle='#f4fbff';ctx.fillRect(px,406,120,11);ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();if(!run||paused){ctx.fillStyle='rgba(16,28,50,.7)';ctx.fillRect(0,180,720,90);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='22px system-ui';ctx.fillText(paused?'PAUSED':score===280?'CLEAR!':'READY TO PLAY',360,233)}}
async function end(won){run=false;$('pause').disabled=true;$('start').disabled=true;$('name').disabled=false;$('loginBtn').disabled=false;$('gameState').textContent=won?'축하합니다! 모든 벽돌을 깼어요.':'도전 종료! 다시 도전해 보세요.';const record={name:userName,score};try{if(firebaseConfig.apiKey){if(cloudPromise)await cloudPromise;if(!db)throw Error();await fb.runTransaction(fb.ref(db,'scores/'+uid),old=>!old||record.score>=old.score?record:old);$('saveState').textContent='Firebase 저장 완료';}else{scores.push(record);scores.sort((a,b)=>b.score-a.score);scores=scores.slice(0,10);localStorage.setItem('student-lab-scores',JSON.stringify(scores));ranks(scores);$('saveState').textContent='이 기기에 저장 완료 · Firebase 미연결';}}catch{$('saveState').textContent='기록 저장 실패 · 연결 또는 저장 권한을 확인하세요.'}finally{$('start').disabled=false}}
$('start').onclick=()=>{field();resetBall();score=0;lives=3;paused=false;run=true;$('score').textContent=0;$('lives').textContent=3;$('pause').textContent='일시정지';$('pause').disabled=false;$('start').disabled=true;$('name').disabled=true;$('loginBtn').disabled=true;$('gameState').textContent='벽돌을 모두 깨세요!';cv.focus()};
function pause(){if(run){paused=!paused;$('pause').textContent=paused?'계속하기':'일시정지';$('gameState').textContent=paused?'잠시 쉬는 중입니다.':'벽돌을 모두 깨세요!'}}$('pause').onclick=pause;
cv.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();keys[e.key]=true;if(e.key===' '&&!e.repeat)pause()}});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};if(run&&!paused)pause()});cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);move(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')move(e)});function move(e){const r=cv.getBoundingClientRect();px=Math.max(0,Math.min(600,(e.clientX-r.left)*720/r.width-60))}
function frame(t){let dt=Math.min((t-last)/1000,.025);last=t;if(run&&!paused){px=Math.max(0,Math.min(600,px+((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*480*dt));x+=vx*dt;y+=vy*dt;if(x<8){x=8;vx=Math.abs(vx)}if(x>712){x=712;vx=-Math.abs(vx)}if(y<8){y=8;vy=Math.abs(vy)}if(vy>0&&y+8>=406&&y<422&&x>=px-8&&x<=px+128){y=398;vy=-Math.abs(vy);vx=(x-(px+60))*5}for(const b of bricks){if(b.on&&x+8>b.x&&x-8<b.x+88&&y+8>b.y&&y-8<b.y+22){b.on=false;vy=-vy;score+=10;$('score').textContent=score;break}}if(score===280)end(true);else if(y>450){lives--;$('lives').textContent=lives;if(!lives)end(false);else resetBall()}}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
